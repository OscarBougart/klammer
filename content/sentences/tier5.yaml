# Tier 5 — Das Nachfeld.
#
# What may stand behind the right bracket: a comparison with `als`/`wie`, and
# a whole subclause carried as one tile. Every comparison sentence but one has
# a right bracket (Perfekt) so the Nachfeld is visibly outside it. A
# comparison may also stay inside the bracket (`gueltig`); a subclause may
# instead fill the Vorfeld.
#
# The generator cannot tell which tile a comparison belongs to, so when that
# tile is fronted it still offers `als …` inside the bracket: `Besser hat sie
# als ich gespielt`, which is not German. Those orders are vetoed per sentence.
#
# All `verified: false`: drafted without a native speaker. GERMAN-REVIEW.md.
#
# Authored source of truth. Edit here, then `npm run content:expand`.

# ─── Comparisons behind the bracket ───

