# Tier 4 — Der Nebensatz.
#
# The conjunction takes the left bracket and the finite verb goes last. Most
# entries play only the subclause, behind a fixed lead-in (`matrix`) that is
# shown above the row and is not a tile. The last group is a main clause with
# a whole subclause carried as one tile, which may stand in the Vorfeld or
# behind the bracket.
#
# Every subclause has exactly one movable pair — an object beside a time,
# manner or instrument phrase, or an object pronoun beside a full-noun
# subject — so it has more than one accepted order and nothing else moves.
# Kept out on purpose: a full-noun subject next to an adverbial, and an object
# next to a place or direction phrase. Both alternate freely in real German and
# the generator would reject the second order.
#
# All `verified: false`: drafted without a native speaker. GERMAN-REVIEW.md.
#
# Authored source of truth. Edit here, then `npm run content:expand`.

# ─── Verb last: the subclause, behind a fixed lead-in ───

