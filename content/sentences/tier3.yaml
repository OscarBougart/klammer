# Tier 3 — Das Mittelfeld.
#
# The middle field stops being a bag and acquires an internal order:
#
#   pronouns first, and among themselves accusative before dative
#   full noun objects after them, dative before accusative
#   adverbials by time – reason – manner – place
#   negation pressed against the right bracket
#
# The pronoun rule is the one worth the tier on its own, because it inverts:
# two full nouns run dative-then-accusative, two pronouns run the other way.
#
# Deliberately absent: negation together with a place phrase. The generator
# currently orders those wrongly and the question is open — see
# GERMAN-REVIEW.md §1.5. Nothing here relies on it.
#
# Authored source of truth. Edit here, then `npm run content:expand`.

