# Tier 1 — Position zwei.
#
# The finite verb is second. That is the whole lesson, so these sentences carry
# no separable prefixes, no Perfekt and no modals — nothing that would open a
# right bracket before tier 2 teaches it.
#
# Vocabulary stays inside Goethe A1–A2. Every sentence is something a person
# would actually say; none of them are `Der Lehrer gibt dem Schüler das Buch`.
#
# Authored source of truth. Edit here, then `npm run content:expand`.
# content/generated/seed.json is build output and is never hand-edited.

