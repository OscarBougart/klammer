# Tier 2 — Die Klammer.
#
# The first content where the right bracket exists, and therefore the first
# content where the Klammer arc has anything to close on. Three constructions
# open a bracket: a separable prefix, a Perfekt participle, and a modal plus
# infinitive. All three are the same shape — finite part second, the rest at
# the very end — which is the point tier 2 exists to make.
#
# Every sentence here has at least five chunks. Fewer than that and the puzzle
# is guessable, which is the risk epics.md flags for exactly this tier.
#
# Authored source of truth. Edit here, then `npm run content:expand`.

