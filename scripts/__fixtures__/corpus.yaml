# Klammer — E1.7 acceptance corpus
#
# Hand-written expected output for scripts/expand.ts.
# Orders are chunk-id sequences. `accept` lists every arrangement the expander
# MUST produce, with its expected class. `reject` lists arrangements it MUST
# NOT produce — these catch the failure that matters most, teaching wrong German.
#
# k = kanonisch · g = gueltig · u = ungewoehnlich

# ─── Tier 1 · Position zwei ────────────────────────────────────────────────

- id: t1-01
  tier: 1
  rule: v2-deklarativ
  gloss: I drink coffee in the mornings.
  chunks:
    ich:     { surface: "Ich",     neutral: "ich",     role: SUBJ }
    trinke:  { surface: "trinke",  neutral: "trinke",  role: FIN }
    morgens: { surface: "morgens", neutral: "morgens", role: TEMP }
    kaffee:  { surface: "Kaffee",  neutral: "Kaffee",  role: AKK, definite: false }
  accept:
    - [k, ich, trinke, morgens, kaffee]
    - [g, morgens, trinke, ich, kaffee]
    - [u, kaffee, trinke, ich, morgens]      # contrastive: coffee, as opposed to tea
    # Native review 1.1: marked, not wrong. Reads with focus on `morgens`.
    - [u, ich, trinke, kaffee, morgens]
  reject:
    - [ich, morgens, trinke, kaffee]         # FIN not second


- id: t1-02
  tier: 1
  rule: tekamolo-te-lo
  gloss: We have lived in Aachen for three years.
  chunks:
    wir:   { surface: "Wir",              neutral: "wir",              role: SUBJ }
    wohn:  { surface: "wohnen",           neutral: "wohnen",           role: FIN }
    seit:  { surface: "Seit drei Jahren", neutral: "seit drei Jahren", role: TEMP }
    aachen: { surface: "In Aachen",        neutral: "in Aachen",        role: LOK }
  accept:
    - [k, wir, wohn, seit, aachen]
    - [g, seit, wohn, wir, aachen]
    - [g, aachen, wohn, wir, seit]   # native review P2: place fronting is ordinary
  reject:
    - [wir, wohn, aachen, seit]              # LOK before TEMP breaks TeKaMoLo

- id: t1-03
  tier: 1
  rule: v2-deklarativ
  gloss: My daughter goes to school at eight.
  chunks:
    tochter: { surface: "Meine Tochter", neutral: "meine Tochter", role: SUBJ }
    geht:   { surface: "geht",          neutral: "geht",          role: FIN }
    acht:   { surface: "Um acht Uhr",   neutral: "um acht Uhr",   role: TEMP }
    schule: { surface: "In die Schule", neutral: "in die Schule", role: DIR }
  accept:
    - [k, tochter, geht, acht, schule]
    - [g, acht, geht, tochter, schule]
    - [u, schule, geht, tochter, acht]
  reject:
    - [tochter, geht, schule, acht]

- id: t1-04
  tier: 1
  rule: v2-deklarativ
  gloss: The train arrives in ten minutes.
  chunks:
    zug:  { surface: "Der Zug",         neutral: "der Zug",         role: SUBJ }
    kommt: { surface: "kommt",           neutral: "kommt",           role: FIN }
    zehn: { surface: "In zehn Minuten", neutral: "in zehn Minuten", role: TEMP }
  accept:
    - [k, zug, kommt, zehn]
    - [g, zehn, kommt, zug]
  reject:
    - [zug, zehn, kommt]

- id: t1-05
  tier: 1
  rule: praedikativ-final
  gloss: I'm off at the weekend.
  chunks:
    ich:  { surface: "Ich",             neutral: "ich",             role: SUBJ }
    habe: { surface: "habe",            neutral: "habe",            role: FIN }
    we:   { surface: "Am Wochenende",   neutral: "am Wochenende",   role: TEMP }
    frei: { surface: "frei",            neutral: "frei",            role: PRAED }
  accept:
    - [k, ich, habe, we, frei]
    - [g, we, habe, ich, frei]
    - [u, frei, habe, ich, we]
  reject:
    - [ich, habe, frei, we]                  # predicative must close the field

# ─── Tier 2 · Die Klammer ──────────────────────────────────────────────────

- id: t2-01
  tier: 2
  rule: satzklammer-trennbar
  gloss: I'm picking my sister up from the station tomorrow.
  chunks:
    ich:    { surface: "Ich",             neutral: "ich",             role: SUBJ }
    hole:   { surface: "hole",            neutral: "hole",            role: FIN }
    schw:   { surface: "Meine Schwester", neutral: "meine Schwester", role: AKK, definite: true }
    morgen: { surface: "Morgen",          neutral: "morgen",          role: TEMP }
    bahnhof: { surface: "Vom Bahnhof",     neutral: "vom Bahnhof",     role: DIR }
    ab:     { surface: "ab",              neutral: "ab",              role: PTKVZ }
  accept:
    - [k, ich, hole, schw, morgen, bahnhof, ab]
    - [g, ich, hole, morgen, schw, bahnhof, ab]
    - [g, morgen, hole, ich, schw, bahnhof, ab]
    - [g, schw, hole, ich, morgen, bahnhof, ab]
    - [u, bahnhof, hole, ich, schw, morgen, ab]
  reject:
    - [ich, hole, ab, schw, morgen, bahnhof] # prefix must close the bracket
    - [ich, hole, schw, morgen, ab, bahnhof]

- id: t2-02
  tier: 2
  rule: satzklammer-perfekt
  gloss: We watched a film yesterday.
  chunks:
    wir:    { surface: "Wir",        neutral: "wir",        role: SUBJ }
    haben:  { surface: "haben",      neutral: "haben",      role: FIN }
    gestern: { surface: "Gestern",    neutral: "gestern",    role: TEMP }
    film:   { surface: "Einen Film", neutral: "einen Film", role: AKK, definite: false }
    gesehen: { surface: "gesehen",    neutral: "gesehen",    role: PART }
  accept:
    - [k, wir, haben, gestern, film, gesehen]
    - [g, gestern, haben, wir, film, gesehen]
    - [u, film, haben, wir, gestern, gesehen]
    # Native review 1.1: marked, not wrong.
    - [u, wir, haben, film, gestern, gesehen]
  reject:

    - [wir, haben, gestern, gesehen, film]

- id: t2-03
  tier: 2
  rule: negation-vor-klammer
  gloss: You don't have to work today.
  chunks:
    du:    { surface: "Du",       neutral: "du",       role: SUBJ }
    musst: { surface: "musst",    neutral: "musst",    role: FIN }
    heute: { surface: "Heute",    neutral: "heute",    role: TEMP }
    nicht: { surface: "nicht",    neutral: "nicht",    role: NEG }
    arb:   { surface: "arbeiten", neutral: "arbeiten", role: INF }
  accept:
    - [k, du, musst, heute, nicht, arb]
    - [g, heute, musst, du, nicht, arb]
  reject:
    - [du, musst, nicht, heute, arb]
    - [nicht, musst, du, heute, arb]         # NEG cannot fill the Vorfeld

- id: t2-04
  tier: 2
  rule: satzklammer-trennbar
  gloss: The film starts at eight.
  chunks:
    film: { surface: "Der Film",     neutral: "der Film",    role: SUBJ }
    faengt: { surface: "fängt",       neutral: "fängt",       role: FIN }
    acht: { surface: "Um acht Uhr",  neutral: "um acht Uhr", role: TEMP }
    an:   { surface: "an",           neutral: "an",          role: PTKVZ }
  accept:
    - [k, film, faengt, acht, an]
    - [g, acht, faengt, film, an]
  reject:
    - [film, faengt, an, acht]

- id: t2-05
  tier: 2
  rule: satzklammer-perfekt
  gloss: I left my key at home.
  chunks:
    ich:   { surface: "Ich",             neutral: "ich",             role: SUBJ }
    habe:  { surface: "habe",            neutral: "habe",            role: FIN }
    schl:  { surface: "Meinen Schlüssel",neutral: "meinen Schlüssel",role: AKK, definite: true }
    hause: { surface: "Zu Hause",        neutral: "zu Hause",        role: LOK }
    verg:  { surface: "vergessen",       neutral: "vergessen",       role: PART }
  accept:
    - [k, ich, habe, schl, hause, verg]
    - [g, schl, habe, ich, hause, verg]
    - [g, hause, habe, ich, schl, verg]  # native review P2: place fronting is ordinary
  reject:
    - [ich, habe, hause, schl, verg]         # definite object before LOK

# ─── Tier 3 · Das Mittelfeld ───────────────────────────────────────────────

- id: t3-01
  tier: 3
  rule: dativ-vor-akkusativ
  gloss: I'm giving my mother a book for her birthday.
  chunks:
    ich:   { surface: "Ich",             neutral: "ich",             role: SUBJ }
    schenke: { surface: "schenke",        neutral: "schenke",         role: FIN }
    mutter: { surface: "Meiner Mutter",   neutral: "meiner Mutter",   role: DAT, definite: true }
    gb:    { surface: "Zum Geburtstag",  neutral: "zum Geburtstag",  role: KAUS }
    buch:  { surface: "Ein Buch",        neutral: "ein Buch",        role: AKK, definite: false }
  accept:
    - [k, ich, schenke, mutter, gb, buch]
    - [g, ich, schenke, mutter, buch, gb]
    - [g, gb, schenke, ich, mutter, buch]
    - [g, mutter, schenke, ich, gb, buch]
  reject:
    - [ich, schenke, buch, mutter, gb]       # full-NP AKK before full-NP DAT

- id: t3-02
  tier: 3
  rule: pronomen-akk-vor-dat
  gloss: I'll give it to you tomorrow.
  chunks:
    ich:   { surface: "Ich",    neutral: "ich",    role: SUBJ }
    gebe:  { surface: "gebe",   neutral: "gebe",   role: FIN }
    es:    { surface: "es",     neutral: "es",     role: PRON_AKK, stressable: false }
    dir:   { surface: "dir",    neutral: "dir",    role: PRON_DAT }
    morgen: { surface: "Morgen", neutral: "morgen", role: TEMP }
  accept:
    - [k, ich, gebe, es, dir, morgen]
    - [g, morgen, gebe, ich, es, dir]
  reject:
    - [ich, gebe, dir, es, morgen]           # THE tier-3 test: DAT before AKK pronoun
    - [es, gebe, ich, dir, morgen]           # unstressed pronoun in Vorfeld
    - [ich, gebe, morgen, es, dir]           # pronouns must lead the Mittelfeld

- id: t3-03
  tier: 3
  rule: pronomen-vor-nomen
  gloss: He still hasn't given me the book back.
  chunks:
    er:   { surface: "Er",              neutral: "er",              role: SUBJ }
    hat:  { surface: "hat",             neutral: "hat",             role: FIN }
    mir:  { surface: "mir",             neutral: "mir",             role: PRON_DAT }
    buch: { surface: "Das Buch",        neutral: "das Buch",        role: AKK, definite: true }
    nn:   { surface: "noch nicht",      neutral: "noch nicht",      role: NEG }
    zur:  { surface: "zurückgegeben",   neutral: "zurückgegeben",   role: PART }
  accept:
    - [k, er, hat, mir, buch, nn, zur]
    - [g, buch, hat, er, mir, nn, zur]
  reject:
    - [er, hat, buch, mir, nn, zur]          # full NP before pronoun
    - [er, hat, mir, nn, buch, zur]          # NEG must sit against the bracket

- id: t3-04
  tier: 3
  rule: tekamolo-voll
  gloss: She cycles to work every day.
  chunks:
    sie:  { surface: "Sie",             neutral: "sie",             role: SUBJ }
    faehrt: { surface: "fährt",          neutral: "fährt",           role: FIN }
    tag:  { surface: "Jeden Tag",       neutral: "jeden Tag",       role: TEMP }
    rad:  { surface: "Mit dem Fahrrad", neutral: "mit dem Fahrrad", role: MODAL }
    arb:  { surface: "Zur Arbeit",      neutral: "zur Arbeit",      role: DIR }
  accept:
    - [k, sie, faehrt, tag, rad, arb]
    - [g, tag, faehrt, sie, rad, arb]
    - [u, rad, faehrt, sie, tag, arb]
    - [u, arb, faehrt, sie, tag, rad]
  reject:
    - [sie, faehrt, rad, tag, arb]           # Mo before Te
    - [sie, faehrt, tag, arb, rad]           # Lo before Mo

- id: t3-05
  tier: 3
  rule: tekamolo-voll
  gloss: I'm going to Cologne tomorrow because of the exam.
  chunks:
    ich:   { surface: "Ich",               neutral: "ich",               role: SUBJ }
    fahre: { surface: "fahre",             neutral: "fahre",             role: FIN }
    morgen: { surface: "Morgen",            neutral: "morgen",            role: TEMP }
    pruef: { surface: "Wegen der Prüfung", neutral: "wegen der Prüfung", role: KAUS }
    koeln: { surface: "Nach Köln",         neutral: "nach Köln",         role: DIR }
  accept:
    - [k, ich, fahre, morgen, pruef, koeln]
    - [g, morgen, fahre, ich, pruef, koeln]
    - [g, pruef, fahre, ich, morgen, koeln]
    - [u, koeln, fahre, ich, morgen, pruef]
  reject:
    - [ich, fahre, pruef, morgen, koeln]     # Ka before Te

# ─── Tier 4 · Der Nebensatz ────────────────────────────────────────────────

- id: t4-01
  tier: 4
  rule: verbletzt
  gloss: I don't know whether he's coming tomorrow.
  note: Only the subordinate clause is played; the matrix clause is fixed scaffolding.
  matrix: "Ich weiß nicht, …"
  chunks:
    ob:    { surface: "ob",     neutral: "ob",     role: KONJ }
    er:    { surface: "er",     neutral: "er",     role: SUBJ }
    morgen: { surface: "morgen", neutral: "morgen", role: TEMP }
    kommt: { surface: "kommt",  neutral: "kommt",  role: FIN }
  accept:
    - [k, ob, er, morgen, kommt]
  reject:
    - [ob, er, kommt, morgen]                # FIN must be last
    - [ob, morgen, er, kommt]                # no Vorfeld in a subordinate clause

- id: t4-02
  tier: 4
  rule: rechte-klammer-nebensatz
  gloss: She says she has to pick me up from the station tomorrow.
  matrix: "Sie sagt, …"
  chunks:
    dass:  { surface: "dass",       neutral: "dass",       role: KONJ }
    sie:   { surface: "sie",        neutral: "sie",        role: SUBJ }
    mich:  { surface: "mich",       neutral: "mich",       role: PRON_AKK }
    morgen: { surface: "morgen",     neutral: "morgen",     role: TEMP }
    bhf:   { surface: "vom Bahnhof",neutral: "vom Bahnhof",role: DIR }
    abh:   { surface: "abholen",    neutral: "abholen",    role: INF }
    muss:  { surface: "muss",       neutral: "muss",       role: FIN }
  # The generator will not move an object pronoun behind an adverbial: the
  # evidence is one good sentence (this one) against one bad one (t5-02), which
  # is not enough to state a rule. The author vouches for this one by hand.
  extraAccepted:
    - order: [dass, sie, morgen, mich, bhf, abh, muss]
      class: ungewoehnlich
  accept:
    - [k, dass, sie, mich, morgen, bhf, abh, muss]
    - [u, dass, sie, morgen, mich, bhf, abh, muss]
  reject:
    - [dass, sie, mich, morgen, bhf, muss, abh]  # INF precedes FIN in the bracket
    - [dass, sie, muss, mich, morgen, bhf, abh]

- id: t4-03
  tier: 4
  rule: nebensatz-im-vorfeld
  gloss: Because I was ill, I stayed home.
  chunks:
    weil:  { surface: "Weil ich krank war", neutral: "weil ich krank war", role: NEBENSATZ }
    bin:   { surface: "bin",                neutral: "bin",                role: FIN }
    ich:   { surface: "ich",                neutral: "ich",                role: SUBJ }
    hause: { surface: "zu Hause",           neutral: "zu Hause",           role: LOK }
    gebl:  { surface: "geblieben",          neutral: "geblieben",          role: PART }
  accept:
    - [k, weil, bin, ich, hause, gebl]
    - [g, ich, bin, hause, gebl, weil]       # clause extraposed to the Nachfeld
  reject:
    - [weil, ich, bin, hause, gebl]          # subordinate clause fills the whole Vorfeld

# ─── Tier 5 · Das Nachfeld ─────────────────────────────────────────────────

- id: t5-01
  tier: 5
  rule: nachfeld-vergleich
  gloss: I've read more books than you.
  chunks:
    ich:  { surface: "Ich",         neutral: "ich",         role: SUBJ }
    habe: { surface: "habe",        neutral: "habe",        role: FIN }
    buech: { surface: "Mehr Bücher", neutral: "mehr Bücher", role: AKK, definite: false }
    gel:  { surface: "gelesen",     neutral: "gelesen",     role: PART }
    als:  { surface: "als du",      neutral: "als du",      role: VERGL }
  accept:
    - [k, ich, habe, buech, gel, als]        # comparison extraposed
    - [g, ich, habe, buech, als, gel]        # comparison inside the bracket
  reject:
    - [ich, habe, als, buech, gel]

- id: t5-02
  tier: 5
  rule: nachfeld-nebensatz
  gloss: He told me yesterday that he's moving to Berlin.
  chunks:
    er:    { surface: "Er",       neutral: "er",       role: SUBJ }
    hat:   { surface: "hat",      neutral: "hat",      role: FIN }
    mir:   { surface: "mir",      neutral: "mir",      role: PRON_DAT }
    gestern: { surface: "Gestern", neutral: "gestern",  role: TEMP }
    erz:   { surface: "erzählt",  neutral: "erzählt",  role: PART }
    ns:    { surface: "dass er nach Berlin zieht", neutral: "dass er nach Berlin zieht", role: NEBENSATZ }
  accept:
    - [k, er, hat, mir, gestern, erz, ns]
    - [g, gestern, hat, er, mir, erz, ns]
    # Native review 1.4: only with stress on `mir`, so marked rather than wrong.
    - [u, er, hat, gestern, mir, erz, ns]
  reject:
    - [er, hat, mir, gestern, ns, erz]       # Nachfeld sits outside the bracket
